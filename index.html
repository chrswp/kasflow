<style>

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#17231d;border:1px solid #385044;padding:12px 18px;border-radius:6px;font-size:13px;box-shadow:0 8px 25px #0009;z-index:9;opacity:0;transition:opacity .2s,bottom .2s;pointer-events:none}
  .toast.show{opacity:1;bottom:120px}

  .menu-dropdown{position:absolute;top:56px;right:16px;background:#17231d;border:1px solid #385044;padding:6px 0;min-width:200px;z-index:5;box-shadow:0 8px 25px #0009}

  .loader{width:28px;height:28px;border:3px solid #385044;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  .recap-net .down{color:var(--red)}

  .recap-net .side b.up{color:var(--green)}
  .recap-net .side b.down{color:var(--red)}
  .recap-list{display:flex;flex-direction:column;gap:10px}
  .recap-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font-size:12px}
  .recap-row .name{color:#c9d5cc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .recap-row .name em{font-style:normal;color:var(--muted);margin-left:6px;font-size:10px}
  .recap-row .amt{color:var(--red);font:500 12px Outfit;white-space:nowrap}

  .recap-bar span{display:block;height:100%;background:linear-gradient(90deg,#f28e83,#e57062);border-radius:99px}

    .welcome-row h1{font-size:34px}

</style>

<body>
<div id="root"></div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js';

// ---------- STATE ----------
const state = {
  user: null,
  transactions: [],
  loading: true,
  filter: 'all',
  modal: null, // 'add' | 'edit' | 'export' | 'import' | 'menu' | null
  editing: null, // transaction being edited
  editingEvidence: null,
  db: null,
  storage: null,
  backupPrompt: false,
};

const BACKUP_KEY = 'kasflow.lastBackupAt';
const BACKUP_INTERVAL_DAYS = 7;

const ALLOWED_EVIDENCE_TYPES = ['image/jpeg', 'image/jpg', 'image/png', 'image/bmp', 'image/x-ms-bmp'];
const ALLOWED_EVIDENCE_EXTS = ['jpg', 'jpeg', 'png', 'bmp'];
const MAX_EVIDENCE_BYTES = 500 * 1024; // 500 KB
const UPLOAD_TIMEOUT_MS = 45000;

function validateEvidence(file){
  if(!file) return null;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const typeOk = ALLOWED_EVIDENCE_TYPES.includes(file.type) || ALLOWED_EVIDENCE_EXTS.includes(ext);
  if(!typeOk) return 'Format bukti harus JPG, JPEG, PNG, atau BMP';
  if(file.size > MAX_EVIDENCE_BYTES) return `Ukuran bukti maksimal 500 KB (file Anda ${Math.round(file.size/1024)} KB)`;
  return null;
}

function withTimeout(promise, ms, label){
  let t;
  const timeout = new Promise((_, reject) => {
    t = setTimeout(() => reject(new Error(`${label} melebihi ${Math.round(ms/1000)} detik. Cek koneksi & Firebase Storage rules.`)), ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(t));
}

// ---------- CONFIG (localStorage) ----------
const CONFIG_KEY = 'kasflow.firebase.config';
function getFirebaseConfig(){
  try{ return JSON.parse(localStorage.getItem(CONFIG_KEY)||'null'); }catch{ return null; }
}
function saveFirebaseConfig(cfg){ localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); }
function clearFirebaseConfig(){ localStorage.removeItem(CONFIG_KEY); }

// ---------- UTILS ----------
const $ = (id) => document.getElementById(id);
const root = () => $('root');
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtRp = (n) => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n||0);
const fmtDate = (iso) => new Date(`${iso}T00:00:00`).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const fmtDateChip = () => new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
const escapeHtml = (s='') => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type='success'){
  const el = $('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  setTimeout(()=>{ el.className='toast'; }, 2400);
}

// ---------- FIREBASE INIT ----------
async function initFirebase(){
  const cfg = getFirebaseConfig();
  if(!cfg){ renderSetup(); return; }
  try{
    const app = initializeApp(cfg);
    const auth = getAuth(app);
    await setPersistence(auth, browserLocalPersistence);
    state.db = getFirestore(app);
    state.storage = getStorage(app);
    onAuthStateChanged(auth, async (user) => {
      if(!user){
        try{ await signInAnonymously(auth); }
        catch(err){
          console.error(err);
          toast('Firebase gagal: '+err.code+'. Cek Anonymous Auth aktif & config benar.','error');
        }
        return;
      }
      state.user = user;
      subscribeTransactions();
    });
  }catch(err){
    console.error(err);
    toast('Firebase config tidak valid. Cek ulang.','error');
    setTimeout(()=>{ clearFirebaseConfig(); renderSetup(); }, 1500);
  }
}

function subscribeTransactions(){
  const q = query(collection(state.db, `users/${state.user.uid}/transactions`), orderBy('transaction_date','desc'));
  onSnapshot(q, (snap) => {
    state.transactions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.loading = false;
    checkAutoBackup();
    render();
  }, (err) => {
    console.error(err);
    state.loading = false;
    toast('Gagal memuat data. Cek Firestore Rules.','error');
    render();
  });
}

function checkAutoBackup(){
  if(state.transactions.length === 0) return;
  const last = Number(localStorage.getItem(BACKUP_KEY) || 0);
  const now = Date.now();
  const days = (now - last) / (1000*60*60*24);
  if(!last || days >= BACKUP_INTERVAL_DAYS){
    state.backupPrompt = true;
  }
}

function monthlyRecap(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const prefix = `${y}-${m}`;
  const monthTx = state.transactions.filter(t => (t.transaction_date||'').startsWith(prefix));
  const monthIn = monthTx.filter(t=>t.transaction_type==='cash_in').reduce((s,t)=>s+Number(t.amount||0),0);
  const monthOut = monthTx.filter(t=>t.transaction_type==='cash_out').reduce((s,t)=>s+Number(t.amount||0),0);
  const grouped = {};
  monthTx.filter(t=>t.transaction_type==='cash_out').forEach(t => {
    const key = (t.purpose||'Lainnya').trim() || 'Lainnya';
    grouped[key] = grouped[key] || { name: key, total: 0, count: 0 };
    grouped[key].total += Number(t.amount||0);
    grouped[key].count += 1;
  });
  const top = Object.values(grouped).sort((a,b)=>b.total-a.total).slice(0,3);
  const maxTotal = top[0]?.total || 1;
  const monthLabel = now.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  return { monthLabel, monthIn, monthOut, net: monthIn - monthOut, top, maxTotal, txCount: monthTx.length };
}

// ---------- CRUD ----------
async function addTransaction(payload, file){
  let evidence_url = null, evidence_path = null;
  if(file){
    const err = validateEvidence(file);
    if(err) throw new Error(err);
    const path = `users/${state.user.uid}/evidence/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const r = storageRef(state.storage, path);
    try{
      await withTimeout(uploadBytes(r, file, { contentType: file.type || 'image/jpeg' }), UPLOAD_TIMEOUT_MS, 'Upload bukti');
      evidence_url = await withTimeout(getDownloadURL(r), 15000, 'Ambil URL bukti');
      evidence_path = path;
    } catch(uploadErr){
      const code = uploadErr.code || '';
      let msg = uploadErr.message || 'Upload gagal';
      if(code === 'storage/unauthorized') msg = 'Storage Rules tolak upload. Cek Rules & Storage aktif.';
      else if(code === 'storage/canceled') msg = 'Upload dibatalkan.';
      else if(code === 'storage/unknown') msg = 'Storage error tidak dikenal. Cek koneksi & bucket config.';
      else if(code === 'storage/retry-limit-exceeded') msg = 'Upload timeout. Cek koneksi internet.';
      throw new Error(msg);
    }
  }
  await addDoc(collection(state.db, `users/${state.user.uid}/transactions`), {
    ...payload,
    amount: Number(payload.amount),
    evidence_url,
    evidence_path,
    created_at: serverTimestamp(),
  });
}

async function updateTransaction(id, payload){
  await updateDoc(doc(state.db, `users/${state.user.uid}/transactions/${id}`), {
    transaction_type: payload.transaction_type,
    amount: Number(payload.amount),
    purpose: payload.purpose,
    transaction_date: payload.transaction_date,
    note: payload.note,
    updated_at: serverTimestamp(),
  });
}

async function removeTransaction(item){
  if(!confirm(`Hapus transaksi "${item.purpose}"?`)) return;
  if(item.evidence_path){
    try{ await deleteObject(storageRef(state.storage, item.evidence_path)); }catch(e){ console.warn(e); }
  }
  await deleteDoc(doc(state.db, `users/${state.user.uid}/transactions/${item.id}`));
  toast('Transaksi dihapus');
}

// ---------- BALANCE ----------
function stats(){
  const cashIn = state.transactions.filter(t=>t.transaction_type==='cash_in').reduce((s,t)=>s+Number(t.amount||0),0);
  const cashOut = state.transactions.filter(t=>t.transaction_type==='cash_out').reduce((s,t)=>s+Number(t.amount||0),0);
  return { cashIn, cashOut, balance: cashIn - cashOut };
}
function filtered(){
  if(state.filter==='all') return state.transactions;
  return state.transactions.filter(t => t.transaction_type===state.filter);
}
function countByType(type){
  if(type==='all') return state.transactions.length;
  return state.transactions.filter(t=>t.transaction_type===type).length;
}

function renderMonthlyRecap(){
  if(state.loading) return '';
  const r = monthlyRecap();
  if(r.txCount === 0) return '';
  const netClass = r.net >= 0 ? 'up' : 'down';
  const netSign = r.net >= 0 ? '+' : '−';
  return `
    <div class="recap-card" data-testid="monthly-recap-card">
      <div class="recap-head">
        <h3>Bulan Ini</h3>
        <span class="month-label">${r.monthLabel} · ${r.txCount} transaksi</span>
      </div>
      <div class="recap-net">
        <div>
          <span>Net saldo bulan ini</span>
          <strong class="${netClass}" data-testid="recap-net">${netSign} ${fmtRp(Math.abs(r.net))}</strong>
        </div>
        <div class="side">
          Masuk <b class="up">${fmtRp(r.monthIn)}</b>
          Keluar <b class="down">${fmtRp(r.monthOut)}</b>
        </div>
      </div>
      ${r.top.length === 0 ? `
        <div class="recap-empty">Belum ada pengeluaran bulan ini</div>
      ` : `
        <div style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:10px">Top ${r.top.length} pengeluaran</div>
        <div class="recap-list">
          ${r.top.map((p,i) => `
            <div class="recap-row" data-testid="recap-top-item">
              <div class="name">${i+1}. ${escapeHtml(p.name)}<em>${p.count}×</em></div>
              <div class="amt">${fmtRp(p.total)}</div>
              <div class="recap-bar"><span style="width:${Math.max(6, Math.round((p.total/r.maxTotal)*100))}%"></span></div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

// ---------- EXPORT EXCEL ----------
function exportExcel({ start, end, opening, reporter }){
  const XLSX = window.XLSX;
  const rows = state.transactions.filter(t => t.transaction_date>=start && t.transaction_date<=end).sort((a,b)=>a.transaction_date.localeCompare(b.transaction_date));
  const cashIn = rows.filter(t=>t.transaction_type==='cash_in').reduce((s,t)=>s+Number(t.amount||0),0);
  const cashOut = rows.filter(t=>t.transaction_type==='cash_out').reduce((s,t)=>s+Number(t.amount||0),0);
  const startLabel = new Date(`${start}T00:00:00`).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const endLabel = new Date(`${end}T00:00:00`).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const data = [
    ['PETTY CASH REPORT'],
    [`Period: ${startLabel} s.d. ${endLabel}`],
    [`Reported by: ${reporter||'-'}`],
    [],
    ['No','Tanggal','Jenis Pengeluaran','Keterangan','Cash In (Rp)','Cash Out (Rp)'],
    ['','','',`Saldo awal periode (saldo per ${startLabel})`, opening, ''],
    ...rows.map((t,i)=>[i+1, new Date(`${t.transaction_date}T00:00:00`), t.purpose, t.note||t.purpose, t.transaction_type==='cash_in'?Number(t.amount):'', t.transaction_type==='cash_out'?Number(t.amount):'']),
    ['','','','','',''],
    ['','','','Total', opening+cashIn, cashOut],
    ['','','','','',''],
    ['','','','Balance', opening+cashIn-cashOut, ''],
  ];
  const sheet = XLSX.utils.aoa_to_sheet(data);
  sheet['A1'].s = { font:{name:'Arial',sz:16,bold:true,color:{rgb:'404040'}}, alignment:{horizontal:'center'} };
  ['A2','A3'].forEach(c => { sheet[c].s = { font:{name:'Arial',sz:10,color:{rgb:'404040'}}, alignment:{horizontal:'center'} }; });
  const headStyle = { fill:{fgColor:{rgb:'404040'}}, font:{name:'Arial',sz:10,bold:true,color:{rgb:'FFFFFF'}}, alignment:{horizontal:'center',vertical:'center',wrapText:true}, border:{top:{style:'thin',color:{rgb:'B7B7B7'}},bottom:{style:'thin',color:{rgb:'B7B7B7'}},left:{style:'thin',color:{rgb:'B7B7B7'}},right:{style:'thin',color:{rgb:'B7B7B7'}}} };
  ['A5','B5','C5','D5','E5','F5'].forEach(c => { sheet[c].s = headStyle; });
  const border = { top:{style:'thin',color:{rgb:'D9D9D9'}},bottom:{style:'thin',color:{rgb:'D9D9D9'}},left:{style:'thin',color:{rgb:'D9D9D9'}},right:{style:'thin',color:{rgb:'D9D9D9'}} };
  for(let r=6;r<=data.length;r++) for(let c=0;c<6;c++){
    const cell = XLSX.utils.encode_cell({r:r-1,c});
    if(sheet[cell]) sheet[cell].s = { font:{name:'Arial',sz:10,color:{rgb:'404040'}}, border, alignment:{vertical:'center',horizontal:c===3?'left':c>=4?'right':'center'}, numFmt: c>=4?'#,##0':c===1?'dd/mm/yyyy':undefined };
  }
  ['D','E','F'].forEach(col => { const cell = `${col}${data.length-2}`; if(sheet[cell]) sheet[cell].s = { font:{name:'Arial',sz:10,bold:true,color:{rgb:'404040'}}, border, alignment:{horizontal:'right'}, numFmt:'#,##0' }; });
  sheet[`D${data.length}`].s = { font:{name:'Arial',sz:10,bold:true,color:{rgb:'386A9B'}}, fill:{fgColor:{rgb:'D9E2F3'}}, border, alignment:{horizontal:'right'} };
  sheet[`E${data.length}`].s = { font:{name:'Arial',sz:10,bold:true,color:{rgb:'386A9B'}}, fill:{fgColor:{rgb:'D9E2F3'}}, border, alignment:{horizontal:'right'}, numFmt:'#,##0' };
  sheet['!merges'] = [{s:{r:0,c:0},e:{r:0,c:5}},{s:{r:1,c:0},e:{r:1,c:5}},{s:{r:2,c:0},e:{r:2,c:5}}];
  sheet['!cols'] = [{wch:6},{wch:14},{wch:22},{wch:44},{wch:16},{wch:16}];
  sheet['!rows'] = [{hpt:25},{hpt:18},{hpt:18},{hpt:9},{hpt:25}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet, 'Petty Cash Report');
  XLSX.writeFile(wb, `petty-cash-report-${start}-${end}.xlsx`);
}

// ---------- ACTIONS (window.__kf) ----------
window.__kf = {
  toggleMenu(){ state.modal = state.modal==='menu' ? null : 'menu'; render(); },
  openModal(m){ state.modal = m; render(); },
  closeModal(){ state.modal = null; state.editing = null; render(); },
  setFilter(f){ state.filter = f; render(); },
  startEdit(item){ state.editing = item; state.modal = 'edit'; render(); },
  pickType(t){
    const inB = document.getElementById('btn-in');
    const outB = document.getElementById('btn-out');
    document.getElementById('f-type').value = t;
    if(t==='cash_in'){ inB.classList.add('selected','in'); outB.classList.remove('selected','out'); }
    else { outB.classList.add('selected','out'); inB.classList.remove('selected','in'); }
  },
  previewFile(){
    const el = document.getElementById('f-file');
    const f = el.files[0];
    if(!f){
      document.getElementById('upload-text').textContent = 'Lampirkan bukti (JPG/PNG/BMP, max 500 KB)';
      document.getElementById('upload-size').textContent = '';
      return;
    }
    const err = validateEvidence(f);
    if(err){
      toast(err, 'error');
      el.value = '';
      document.getElementById('upload-text').textContent = 'Lampirkan bukti (JPG/PNG/BMP, max 500 KB)';
      document.getElementById('upload-size').textContent = '';
      return;
    }
    document.getElementById('upload-text').textContent = f.name;
    document.getElementById('upload-size').textContent = `${Math.round(f.size/1024)} KB`;
  },
  async submitAdd(e){
    e.preventDefault();
    const isEdit = state.modal === 'edit' && state.editing;
    const btn = document.getElementById('save-btn');
    const resetBtn = () => { btn.disabled = false; btn.textContent = isEdit?'Simpan perubahan':'Simpan transaksi'; };
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    const payload = {
      transaction_type: document.getElementById('f-type').value,
      amount: document.getElementById('f-amount').value,
      purpose: document.getElementById('f-purpose').value.trim(),
      transaction_date: document.getElementById('f-date').value,
      note: document.getElementById('f-note').value.trim(),
    };
    try{
      if(isEdit){
        await updateTransaction(state.editing.id, payload);
        toast('Transaksi diperbarui');
      } else {
        const fileEl = document.getElementById('f-file');
        const file = fileEl && fileEl.files[0] || null;
        if(file){
          const vErr = validateEvidence(file);
          if(vErr){ toast(vErr,'error'); resetBtn(); return; }
        }
        await addTransaction(payload, file);
        toast('Transaksi tersimpan');
      }
      state.modal = null; state.editing = null; render();
    }catch(err){
      console.error(err);
      toast('Gagal menyimpan: '+(err.message||'error tidak diketahui'),'error');
      resetBtn();
    }
  },
  async remove(item){ try{ await removeTransaction(item); }catch(err){ toast('Gagal hapus: '+err.message,'error'); } },
  doExport(e){
    e.preventDefault();
    exportExcel({
      start: document.getElementById('ex-start').value,
      end: document.getElementById('ex-end').value,
      opening: Number(document.getElementById('ex-opening').value||0),
      reporter: document.getElementById('ex-reporter').value.trim(),
    });
    toast('File Excel siap diunduh');
    state.modal = null; render();
  },
  exportJSON(){
    const payload = {
      exported_at: new Date().toISOString(),
      version: 1,
      transactions: state.transactions.map(({ id, ...t }) => t),
    };
    const blob = new Blob([JSON.stringify(payload,null,2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `kasflow-backup-${todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
    toast(`Backup ${payload.transactions.length} transaksi terunduh`);
    localStorage.setItem(BACKUP_KEY, String(Date.now()));
    state.backupPrompt = false;
    state.modal = null; render();
  },
  runAutoBackup(){
    window.__kf.exportJSON();
  },
  dismissBackup(){
    // Snooze 24 hours by setting lastBackupAt to (now - 6 days)
    const snooze = Date.now() - (BACKUP_INTERVAL_DAYS - 1) * 24 * 60 * 60 * 1000;
    localStorage.setItem(BACKUP_KEY, String(snooze));
    state.backupPrompt = false;
    toast('Diingatkan lagi besok');
    render();
  },
  async doImport(e){
    e.preventDefault();
    const file = document.getElementById('imp-file').files[0];
    if(!file){ toast('Pilih file dulu','error'); return; }
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      const list = Array.isArray(data) ? data : data.transactions;
      if(!Array.isArray(list)) throw new Error('Format JSON tidak valid');
      let imported = 0;
      for(const t of list){
        const { id, created_at, evidence_path, evidence_url, ...rest } = t;
        if(!rest.transaction_type || !rest.amount || !rest.purpose || !rest.transaction_date) continue;
        await addDoc(collection(state.db, `users/${state.user.uid}/transactions`), {
          ...rest,
          amount: Number(rest.amount),
          evidence_url: evidence_url || null,
          evidence_path: null, // don't re-link storage path from other project
          created_at: serverTimestamp(),
        });
        imported++;
      }
      toast(`Berhasil import ${imported} transaksi`);
      state.modal = null; render();
    }catch(err){
      console.error(err);
      toast('Gagal import: '+err.message,'error');
    }
  },
  saveSetup(e){
    e.preventDefault();
    let raw = document.getElementById('setup-cfg').value.trim();
    // strip "const firebaseConfig = " and trailing semicolons
    raw = raw.replace(/^\s*(?:const|let|var)\s+\w+\s*=\s*/,'').replace(/;+\s*$/,'');
    let cfg;
    try{ cfg = JSON.parse(raw); }
    catch{
      try{ cfg = (new Function(`return (${raw})`))(); }
      catch{ toast('Format config tidak dikenali','error'); return; }
    }
    if(!cfg.apiKey || !cfg.projectId){ toast('apiKey & projectId wajib ada','error'); return; }
    saveFirebaseConfig(cfg);
    toast('Config tersimpan, memuat aplikasi...');
    setTimeout(()=>{ location.reload(); }, 700);
  },
  resetConfig(){
    if(!confirm('Reset Firebase config? Data di Firebase tidak akan terhapus, tapi Anda perlu paste config lagi.')) return;
    clearFirebaseConfig();
    location.reload();
  },
};

// ---------- SERVICE WORKER ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

// ---------- BOOT ----------
document.addEventListener('click', (e)=>{
  if(state.modal==='menu' && !e.target.closest('.menu-dropdown') && !e.target.closest('[data-testid=menu-button]')){
    state.modal = null; render();
  }
});
initFirebase();
render();
</script>
</body>
